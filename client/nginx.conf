    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Socket.io Proxy - Không cần trong thiết lập Docker + Traefik, Traefik sẽ xử lý routing
