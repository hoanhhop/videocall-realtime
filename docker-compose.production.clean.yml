version: '3.8'

services:
  traefik:
    image: traefik:v2.9
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - translation-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`34.142.175.163`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '256M'

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - PHOWHISPER_ASR_URL=http://phowhisper:50051
      - TRANSLATION_SERVICE_URL=http://translation:50052
      - TTS_SERVICE_URL=http://tts:5002
      - CORS_ORIGIN=*
    networks:
      - translation-network
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`34.142.175.163`) && PathPrefix(`/api`)"
      - "traefik.http.services.api-service.loadbalancer.server.port=3000"
      - "traefik.http.routers.api.entrypoints=web"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - translation-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

volumes:
  redis-data:

networks:
  translation-network:
    driver: bridge
