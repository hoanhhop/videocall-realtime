version: '3.8'

services:
  # API Gateway - Express REST API
  api:
    build:
      context: .
      dockerfile: ./scripts/deploy/docker/Dockerfile.api
    ports:
      - "127.0.0.1:5000:5000"  # Chỉ bind localhost - Nginx sẽ proxy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - PHOWHISPER_ASR_URL=http://phowhisper:50051
      - TRANSLATION_SERVICE_URL=http://translation:50052
      - TTS_SERVICE_URL=http://tts:5002
      - EMBEDDING_SERVICE_URL=http://embeddings:5003
      - CORS_ORIGIN=https://34.142.175.163
      - PUBLIC_URL=https://34.142.175.163
    volumes:
      - ./server:/app/server
    networks:
      - translation-network
    depends_on:
      - redis
      - phowhisper
      - translation
    restart: unless-stopped
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Socket.IO WebSocket Server
  socket:
    build:
      context: .
      dockerfile: ./scripts/deploy/docker/Dockerfile.socket
    ports:
      - "127.0.0.1:4000:5001"  # Chỉ bind localhost - Nginx sẽ proxy
    environment:
      - NODE_ENV=production
      - PORT=5001
      - REDIS_URL=redis://redis:6379
      - PHOWHISPER_ASR_URL=http://phowhisper:50051
      - TRANSLATION_SERVICE_URL=http://translation:50052
      - TTS_SERVICE_URL=http://tts:5002
      - EMBEDDING_SERVICE_URL=http://embeddings:5003
      - CORS_ORIGIN=https://34.142.175.163
      - PUBLIC_URL=https://34.142.175.163
    volumes:
      - ./server:/app/server
    networks:
      - translation-network
    depends_on:
      - redis
      - phowhisper
      - translation
    restart: unless-stopped
    command: npm run start:socket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Client Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://34.142.175.163/api
        - VITE_SOCKET_URL=https://34.142.175.163
        - VITE_ENVIRONMENT=production
    ports:
      - "127.0.0.1:8080:80"  # Chỉ bind localhost - Nginx sẽ proxy
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vietnamese Speech Recognition (PhoWhisper)
  phowhisper:
    build:
      context: ./server/services/phowhisper_asr_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/phowhisper:/app/models/phowhisper:rw
      - phowhisper-cache:/root/.cache
    environment:
      - MODEL_PATH_CT2=/app/models/phowhisper/PhoWhisper-medium-ct2
      - PORT_ASR=50051
      - OMP_NUM_THREADS=4
      - USE_CUDA=true
      - BEAM_SIZE=1
      - GPU_DEVICE=0
      - COMPUTE_TYPE=float16
      - CHUNK_LENGTH=0.4
      - VAD_FILTER=true
      - LOW_MEMORY=true
      - MAX_WORKERS=2
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50051')"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Translation Service (OpusMT)
  translation:
    build:
      context: ./server/services/translation_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/opus_mt:/app/models/opus_mt:ro
      - translation-cache:/root/.cache
    environment:
      - OPUS_MODELS_BASE_PATH=/app/models/opus_mt
      - PORT_TRANSLATION=50052
      - USE_CUDA=true
      - MAX_LENGTH=512
      - BATCH_SIZE=16
      - GPU_DEVICE=0
      - OMP_NUM_THREADS=4
      - NUM_WORKERS=4
      - CPU_THREADS=8
      - MAX_QUEUE_SIZE=32
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50052')"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Text-to-Speech Service (XTTS-v2)
  tts:
    build:
      context: ./server/services/tts_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/tts:/app/models:rw
      - tts-cache:/root/.cache
    environment:
      - MODEL_PATH=/app/models/XTTS-v2
      - ONNX_MODEL_PATH=/app/models/XTTS-v2/onnx
      - PORT=5002
      - USE_CUDA=true
      - USE_ONNX=true
      - BATCH_SIZE=2
      - SPEAKER_WAV_PATH=/app/models/speakers
      - SAMPLE_RATE=24000
      - GPU_DEVICE=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - OMP_NUM_THREADS=4
      - CHUNK_SIZE=150
      - MAX_WORKERS=2
      - LOW_MEMORY=true
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5002/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Embeddings Service (Sentence Transformers)
  embeddings:
    build:
      context: ./server/services/embeddings_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/embeddings:/app/data:rw
      - embeddings-cache:/root/.cache
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - PORT=5003
      - ENABLE_CACHE=true
      - CACHE_DIR=/app/data
      - USE_CUDA=true
      - BATCH_SIZE=32
      - GPU_DEVICE=0
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5003/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - translation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# Persistent volumes for model caching and data storage
volumes:
  redis-data:
    driver: local
  phowhisper-cache:
    driver: local
  translation-cache:
    driver: local
  tts-cache:
    driver: local
  embeddings-cache:
    driver: local

# Isolated network for secure container communication
networks:
  translation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
