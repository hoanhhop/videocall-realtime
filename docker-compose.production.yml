version: '3.8'

services:  # API Gateway - Express REST API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      PHOWHISPER_ASR_URL: http://phowhisper:50051
      TRANSLATION_SERVICE_URL: http://translation:50052
      TTS_SERVICE_URL: http://tts:5002
      EMBEDDING_SERVICE_URL: http://embeddings:5003
      CORS_ORIGIN: '*'
      PUBLIC_URL: https://34.142.175.163
    networks:
      - translation-network
    depends_on:
      - redis
      - phowhisper
      - translation
      - tts
      - embeddings
    restart: unless-stopped
    command: npm start
  # Socket.IO WebSocket Server  
  socket:
    build:
      context: ./server
      dockerfile: Dockerfile.socket
    ports:
      - '4000:5001'
    environment:
      NODE_ENV: production
      PORT: 5001
      REDIS_URL: redis://redis:6379
      PHOWHISPER_ASR_URL: http://phowhisper:50051
      TRANSLATION_SERVICE_URL: http://translation:50052
      TTS_SERVICE_URL: http://tts:5002
      EMBEDDING_SERVICE_URL: http://embeddings:5003
      CORS_ORIGIN: '*'
      PUBLIC_URL: https://34.142.175.163
    networks:
      - translation-network
    depends_on:
      - redis
      - phowhisper
      - translation
      - tts
      - embeddings
    restart: unless-stopped
    command: npm run start:socket

  # Vietnamese Speech Recognition (PhoWhisper)
  phowhisper:
    build:
      context: ./server/services/phowhisper_asr_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/phowhisper:/app/models/phowhisper:rw
      - phowhisper-cache:/root/.cache
    environment:
      MODEL_PATH_CT2: /app/models/phowhisper/PhoWhisper-medium-ct2
      PORT_ASR: 50051
      OMP_NUM_THREADS: 6
      USE_CUDA: "false"
      BEAM_SIZE: 1
      GPU_DEVICE: -1
      COMPUTE_TYPE: int8
      CHUNK_LENGTH: 0.3
      VAD_FILTER: "true"
      LOW_MEMORY: "false"
      MAX_WORKERS: 3
    networks:
      - translation-network
    restart: unless-stopped

  # Translation Service (OpusMT)
  translation:
    build:
      context: ./server/services/translation_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/opus_mt:/app/models/opus_mt:ro
      - translation-cache:/root/.cache
    environment:
      OPUS_MODELS_BASE_PATH: /app/models/opus_mt
      PORT_TRANSLATION: 50052
      USE_CUDA: "false"
      MAX_LENGTH: 512
      BATCH_SIZE: 2
      GPU_DEVICE: -1
      OMP_NUM_THREADS: 4
      NUM_WORKERS: 2
      CPU_THREADS: 4
      MAX_QUEUE_SIZE: 16
      COMPUTE_TYPE: int8
    networks:
      - translation-network
    restart: unless-stopped

  # Text-to-Speech Service (XTTS-v2)
  tts:
    build:
      context: ./server/services/tts_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/tts:/app/models:rw
      - tts-cache:/root/.cache
    environment:
      MODEL_PATH: /app/models/XTTS-v2
      PORT: 5002
      USE_CUDA: "false"
      USE_ONNX: "false"
      BATCH_SIZE: 1
      SPEAKER_WAV_PATH: /app/models/speakers
      SAMPLE_RATE: 22050
      GPU_DEVICE: -1
      OMP_NUM_THREADS: 4
      CHUNK_SIZE: 120
      MAX_WORKERS: 4
      LOW_MEMORY: "true"
      COMPUTE_TYPE: int8
    networks:
      - translation-network
    restart: unless-stopped

  # Embeddings Service
  embeddings:
    build:
      context: ./server/services/embeddings_service
      dockerfile: Dockerfile
    volumes:
      - ./server/models/embeddings:/app/data:rw
      - embeddings-cache:/root/.cache
    environment:
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      PORT: 5003
      ENABLE_CACHE: "true"
      CACHE_DIR: /app/data
      USE_CUDA: "false"
      BATCH_SIZE: 16
      GPU_DEVICE: -1
    networks:
      - translation-network
    restart: unless-stopped
  # React Client Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://34.142.175.163/api
        VITE_SOCKET_URL: https://34.142.175.163
        VITE_ENVIRONMENT: production
    ports:
      - "8080:80"
    networks:
      - translation-network
    restart: unless-stopped

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - translation-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  phowhisper-cache:
    driver: local
  translation-cache:
    driver: local
  tts-cache:
    driver: local
  embeddings-cache:
    driver: local

networks:
  translation-network:
    driver: bridge
